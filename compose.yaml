services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noma
      POSTGRES_PASSWORD: noma
      POSTGRES_DB: noma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - noma_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noma"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  noma_data:
